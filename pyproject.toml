[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio_toolkit"
version = "0.1.0"
description = "Utilities for ASR, large audio, and speech representation models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "B1ubiu" }]
keywords = ["speech", "asr", "audio", "multimodal", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Shared waveform conversion and local model interfaces.
    "numpy>=1.24",
    "torch>=2.0",
    "torchaudio>=2.0",
]

[project.optional-dependencies]
# Text and perceptual metrics from audio_toolkit.utils.
metrics = [
    "jiwer>=3.0",
    "pysepm @ https://github.com/schmiph2/pysepm/archive/master.zip",
]
# Local ASR backends.
whisper = ["openai-whisper>=20250625"]
nemo = ["nemo-toolkit[asr]>=2.6.2"]
# Large audio models. accelerate is required by Transformers device_map loading.
qwen = [
    "accelerate>=0.26",
    "librosa>=0.10",
    "qwen-asr>=0.0.6",
    "transformers>=4.45",
]
# Alibaba and Tencent cloud ASR clients.
api = [
    "aliyun-python-sdk-core>=2.16",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "tencentcloud-sdk-python>=3.0",
    "websocket-client>=1.0",
]
# Complete feature installation; base dependencies are included automatically.
all = [
    "accelerate>=0.26",
    "aliyun-python-sdk-core>=2.16",
    "jiwer>=3.0",
    "librosa>=0.10",
    "nemo-toolkit[asr]>=2.6.2",
    "openai-whisper>=20250625",
    "pysepm @ https://github.com/schmiph2/pysepm/archive/master.zip",
    "python-dotenv>=1.0",
    "qwen-asr>=0.0.6",
    "requests>=2.28",
    "tencentcloud-sdk-python>=3.0",
    "transformers>=4.45",
    "websocket-client>=1.0",
]
# Repository quality and package-build tooling.
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_toolkit*"]
exclude = [
    "audio_toolkit.model_cache*",
    "audio_toolkit.asr.api.tencent.service.tencentcloud-speech-sdk-python*",
]

[tool.setuptools.package-data]
"audio_toolkit.asr.api.alibaba" = [".env.example"]
"audio_toolkit.asr.api.tencent" = [".env.example", "README.md"]

