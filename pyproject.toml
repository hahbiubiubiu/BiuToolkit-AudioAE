[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biu-toolkit"
version = "0.1.0"
description = "SpeechAE utilities for speech representation models and ASR backends"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "B1ubiu" }]
keywords = ["speech", "asr", "audio", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jiwer>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "torchaudio>=2.0",
]

[project.optional-dependencies]
metrics = [
    "pysepm @ https://github.com/schmiph2/pysepm/archive/master.zip",
]
whisper = ["openai-whisper>=20250625"]
nemo = ["nemo-toolkit[asr]>=2.6.2"]
qwen = [
    "librosa>=0.10",
    "qwen-asr",
    "transformers>=4.45",
]
api = [
    "aliyun-python-sdk-core",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "tencentcloud-sdk-python",
    "websocket-client==0.48.0",
]
all = [
    "aliyun-python-sdk-core",
    "librosa>=0.10",
    "nemo-toolkit[asr]>=2.6.2",
    "openai-whisper>=20250625",
    "pysepm @ https://github.com/schmiph2/pysepm/archive/master.zip",
    "python-dotenv>=1.0",
    "qwen-asr",
    "requests>=2.28",
    "tencentcloud-sdk-python",
    "transformers>=4.45",
    "websocket-client==0.48.0",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["biu_toolkit*"]
exclude = [
    "biu_toolkit.model_cache*",
    "biu_toolkit.asr.api.tencent.tencentcloud-speech-sdk-python*",
]

